<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-box {
            width: 350px;
            padding: 35px;
            background-color: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .profile-logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;

            background-color: #4a90e2;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 45px;
            color: white;
        }

        h1 {
            margin: 10px 0;
            color: #222;
        }

        .welcome {
            color: #666;
            margin-bottom: 25px;
        }

        .info {
            text-align: left;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .info p {
            font-size: 17px;
            margin: 15px 0;
            color: #333;
        }

        .label {
            font-weight: bold;
            color: #4a90e2;
        }
    </style>
</head>

<body>

    <div class="profile-box">

        <div class="profile-logo">
            👤
        </div>

        <h1>Om Wagh</h1>

        <p class="welcome">
            Welcome to my profile
        </p>

        <div class="info">

            <p>
                <span class="label">Name:</span>
                Om Wagh
            </p>

            <p>
                <span class="label">Department:</span>
                Computer Engineering
            </p>

            <p>
                <span class="label">Message:</span>
                Welcome to my web page!
            </p>

        </div>

    </div>

</body>
</html>
